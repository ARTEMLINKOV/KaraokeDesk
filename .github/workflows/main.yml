
name: Build KaraokeDesk for macOS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'CMakeLists.txt'
      - 'Source/**'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install CMake
        run: brew install cmake

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE

      - name: Configure Intel build for macOS 13+
        run: |
          cmake -S . -B build \
            -DJUCE_DIR="$GITHUB_WORKSPACE/JUCE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Package app
        run: |
          set -e
          APP="build/KaraokeDesk_artefacts/Release/KaraokeDesk.app"
          test -d "$APP"

          echo "Checking Intel executable architecture:"
          lipo -archs "$APP/Contents/MacOS/KaraokeDesk"

          mkdir -p release
          ditto "$APP" release/KaraokeDesk.app

          cd release
          zip -r ../KaraokeDesk-macOS.zip KaraokeDesk.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeDesk-macOS
          path: KaraokeDesk-macOS.zip
