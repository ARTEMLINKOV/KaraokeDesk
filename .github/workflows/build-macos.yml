name: Build KaraokeDesk for macOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'CMakeLists.txt'
      - 'README_RU.txt'
      - 'Source/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout KaraokeDesk
        uses: actions/checkout@v4

      - name: Install CMake
        run: brew install cmake

      - name: Download pinned CEF SDK
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cef-macos-x86_64.tar.bz2"
          url="https://cef-builds.spotifycdn.com/cef_binary_156.0.8%2Bg426920c%2Bchromium-156.0.8078.48_macosx64_minimal.tar.bz2"
          curl --fail --location --retry 3 "$url" --output "$archive"
          echo "d0829e80257211248ff0798b5b389d7c4faa053515cdf4b2276c0bf8a83aba2e  $archive" | shasum --check
          tar -xjf "$archive" -C "$RUNNER_TEMP"
          echo "CEF_ROOT=$RUNNER_TEMP/cef_binary_156.0.8+g426920c+chromium-156.0.8078.48_macosx64_minimal" >> "$GITHUB_ENV"

      - name: Get JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"

      - name: Configure Intel build for macOS 13+
        run: >-
          cmake -S . -B build
          -DJUCE_DIR="$RUNNER_TEMP/JUCE"
          -DCEF_ROOT="$CEF_ROOT"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Compile
        run: cmake --build build --config Release --parallel 3

      - name: Verify Intel architecture and package app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build -type d -name 'KaraokeDesk.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "KaraokeDesk.app was not found after the build."
            find build -maxdepth 5 -print
            exit 1
          fi
          ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/KaraokeDesk")"
          echo "Built executable architectures: $ARCHS"
          [[ "$ARCHS" == "x86_64" ]]
          [[ -f "$APP_PATH/Contents/Frameworks/Chromium Embedded Framework.framework/Chromium Embedded Framework" ]]
          for helper in \
            "KaraokeDesk Helper" \
            "KaraokeDesk Helper (Alerts)" \
            "KaraokeDesk Helper (GPU)" \
            "KaraokeDesk Helper (Plugin)" \
            "KaraokeDesk Helper (Renderer)"; do
            [[ -x "$APP_PATH/Contents/Frameworks/$helper.app/Contents/MacOS/$helper" ]]
          done
          [[ "$(plutil -extract NSPrincipalClass raw "$APP_PATH/Contents/Info.plist")" == "KaraokeDeskCEFApplication" ]]
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" KaraokeDesk-macOS.zip
          hdiutil create -volname "KaraokeDesk" -srcfolder "$APP_PATH" \
            -ov -format UDZO KaraokeDesk-macOS.dmg

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeDesk-macOS
          path: |
            KaraokeDesk-macOS.zip
            KaraokeDesk-macOS.dmg
          if-no-files-found: error
          retention-days: 7
